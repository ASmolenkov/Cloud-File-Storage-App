spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/CloudFileStorage
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  application:
    name: CloudFileStorage
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG
    org.flywaydb.core.internal.command: DEBUG